<div class="report-container">
  <p-table [value]="beneficiaryList()" [tableStyle]="{ 'width': '100%' }">
    <ng-template pTemplate="caption">
      <div class="d-flex justify-content-start align-items-center">
        <button
          type="button"
          class="btn btn-success btn-sm me-2"
          (click)="exportExcel()"
          pTooltip="XLS"
          tooltipPosition="bottom"
        >
          <i class="fas fa-file-excel me-2"></i>Export as XLS
        </button>
        <button
          type="button"
          class="btn btn-warning btn-sm"
          (click)="exportPdf()"
          pTooltip="PDF"
          tooltipPosition="bottom"
        >
          <i class="fas fa-file-pdf me-2"></i>Export as PDF
        </button>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        @for (col of cols(); track col.field) {
          <th class="text-center" style="background-color: cornflowerblue; color: white;">
            {{ col.header }}
          </th>
        }
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-beneficiary>
      <tr>
        <td class="text-center">{{ beneficiary.staffId }}</td>
        <td class="text-center">{{ beneficiary.staffName }}</td>
        <td class="text-center">{{ beneficiary.registrationPhase }}</td>
        <td class="text-center">{{ beneficiary.count }}</td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">Nothing Found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

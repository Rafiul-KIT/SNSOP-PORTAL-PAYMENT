@if (isLoading) {
<app-loader></app-loader>
} @else {
<div class="breadcrumb-wrapper">
  <p-breadcrumb [model]="breadcrumbItems" [home]="breadcrumbHome" class="w-100"></p-breadcrumb>
</div>

<div class="card p-3 mb-2">
  <div class="row d-flex align-items-center">
    <div class="col-12 col-md-6 col-lg-8">
      <h5 class="m-0">Project List</h5>
    </div>
    <div class="col-lg-4 d-flex justify-content-end">
      <div class="d-flex align-items-center gap-2">
        <p-button label="Add New" pTooltip="Create New Project" tooltipPosition="top" icon="fas fa-plus"
          (onClick)="newProject()" size="small" class="w-auto" />
      </div>
    </div>

  </div>
</div>

<p-table [value]="rows" dataKey="id" [scrollable]="true" scrollHeight="64vh"
  [tableStyle]="{ 'width': '100%', 'margin-bottom': '5px' }" size="small">
  <ng-template pTemplate="header">
    <tr>
      <th>Serial</th>
      <th>Name</th>
      <th>Start Date</th>
      <th>End Date</th>
      <th>Incharge</th>
      <th>Status</th>
      <th style="width:140px" class="text-center">Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-project let-i="rowIndex">
    <tr>
      <td>{{ (currentPage * pageSize) + i + 1 }}</td>
      <td>{{ project.projectName }}</td>
      <td>{{ project.startAt }}</td>
      <td>{{ project.endAt }}</td>
      <td>{{ project.inchargeName }}</td>
      <td>
        <span class="badge" [ngClass]="{
      'bg-warning text-dark': project.status === 'InProgress',
      'bg-success': project.status === 'Closed'
    }">
          {{ project.status }}
        </span>
      </td>
      <td class="text-center ">


        <button pButton type="button" icon="fas fa-pencil-alt"
          class="p-button-sm p-button-rounded p-button-secondary me-2" pTooltip="View & Edit" tooltipPosition="top"
          appendTo="body" (click)="editProject(project.id)"></button>


        <button pButton type="button" icon="fas fa-trash" class="p-button-sm p-button-rounded p-button-danger"
          pTooltip="Delete Project" tooltipPosition="top" appendTo="body" (click)="deleteProject(project.id)"></button>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="7" class="text-center py-4 text-muted">
        No projects found.
      </td>
    </tr>
  </ng-template>
</p-table>

<p-paginator class="paginator-sticky" [rows]="pageSize" [totalRecords]="totalRecords"
  [rowsPerPageOptions]="[10, 25, 50]" (onPageChange)="onPageChange($event)" [first]="currentPage * pageSize"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries">
</p-paginator>
}

<div class="report-container">
  <p-table [value]="householdSurveyData()" [tableStyle]="{ 'width': '100%' }">
  
    <ng-template pTemplate="header">
      <tr>
        <th class="text-center" style="background-color: cadetblue; color: white">Date</th>
        <th class="text-center" style="background-color: cadetblue; color: white">PP (Parent project)</th>
        <th class="text-center" style="background-color: cadetblue; color: white">AF (Additional Financing)</th>
        <th class="text-center" style="background-color: cadetblue; color: white">ALL</th>
      </tr>
    </ng-template>


    <ng-template pTemplate="body" let-row>
      <tr>
        <td class="text-center">{{ row.date }}</td>
        <td class="text-center">
          @if (row.parent_file) {
            <a href="{{ downloadLocation }}{{ row.parent_file }}">Download</a>
          } @else {
            <span>N/A</span>
          }
        </td>
        <td class="text-center">
          @if (row.af_file) {
            <a href="{{ downloadLocation }}{{ row.af_file }}">Download</a>
          } @else {
            <span>N/A</span>
          }
        </td>
        <td class="text-center">
          @if (row.all_file) {
            <a href="{{ downloadLocation }}{{ row.all_file }}">Download</a>
          } @else {
            <span>N/A</span>
          }
        </td>
      </tr>
    </ng-template>

  
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">Nothing Found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
